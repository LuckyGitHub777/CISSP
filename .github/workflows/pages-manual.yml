name: Publish CISSP Domain Atlas (manual)

# Existing public repository, but Pages is not enabled in repository settings.
# No push-triggered deployment or implicit publication.
# An authorized repository admin must first select Settings > Pages >
# Build and deployment > Source: GitHub Actions, then run this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cissp-atlas-pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run existing static Atlas verification
        run: python -m unittest discover -s tests -p 'test_atlas.py' -v
      - name: Run existing desktop/mobile browser smoke
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          python tests/atlas_browser_smoke.py
      - name: Build exact static public artifact
        run: |
          set -eu
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          test "$(find _site -type f | wc -l)" -eq 2
          test -s _site/index.html
          test ! -d _site/.git
          echo "PASS: exactly index.html and .nojekyll; private files and study notes excluded"
      - name: Configure existing Pages site (does not enable Pages)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload minimal Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified site artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
