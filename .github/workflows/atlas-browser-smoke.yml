name: Atlas Desktop and Mobile Browser Smoke

on:
  pull_request:
    paths:
      - index.html
      - tests/atlas_browser_smoke.py
      - .github/workflows/atlas-browser-smoke.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tests/atlas_browser_smoke.py
      - .github/workflows/atlas-browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-browser-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install browser test dependency
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test offline Atlas desktop and mobile, no external traffic
        run: python tests/atlas_browser_smoke.py
